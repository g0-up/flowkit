# sqlc reads the flowkit migrations as the schema and generates the Postgres
# side of internal/store. Table names carry the /* TEMPLATE: schema */ token,
# which internal/store replaces with the configured schema at run time.
# Regenerate with `make sqlc`; CI runs `make sqlc-check`.
version: "2"
sql:
  - engine: postgresql
    schema: internal/migrate/sql
    queries: internal/store/queries
    gen:
      go:
        package: db
        out: internal/store/db
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type: github.com/g0-up/flowkit/internal/ids.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/g0-up/flowkit/internal/ids
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
